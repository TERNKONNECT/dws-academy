  <script>
    if (!localStorage.getItem("tkw_a11y_prefs")) {
      localStorage.setItem("tkw_a11y_prefs", JSON.stringify({ tts: false }));
    }
    // Applied synchronously, before first paint, so switching themes doesn't
    // flash the wrong one while React hydrates. Mirrors next-themes' own
    // storageKey/attribute config in App.tsx — keep the two in sync.
    (function () {
      var stored = localStorage.getItem("dws-theme");
      if (stored === "light") return;
      document.documentElement.classList.add("dark");
    })();
  </script>
